name: Kaggle API connection check
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/kaggle-api-check.yml"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Kaggle CLI
        run: python -m pip install --upgrade kaggle
      - name: Verify Kaggle API token
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "KAGGLE_API_TOKEN secret is missing."
            exit 1
          fi
          kaggle kernels list --page-size 1
          echo "Kaggle API authentication succeeded."
