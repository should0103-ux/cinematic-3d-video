name: Check Kaggle preview status
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/kaggle-status.yml"
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Kaggle CLI
        run: python -m pip install --upgrade kaggle six
      - name: Resolve account and query notebook status
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          python - <<'PY'
          import os,requests
          r=requests.post("https://www.kaggle.com/api/v1/oauth2/introspect",data={"token":os.environ["KAGGLE_API_TOKEN"]},timeout=30)
          r.raise_for_status(); d=r.json()
          if not d.get("active"): raise SystemExit("Kaggle token inactive")
          with open(os.environ["GITHUB_ENV"],"a") as f: f.write("KAGGLE_USER="+d["username"]+"\\n")
          PY
          kaggle kernels status "$KAGGLE_USER/straw-refraction-preview"
          kaggle kernels output "$KAGGLE_USER/straw-refraction-preview" -p output || true
      - name: Upload rendered MP4 if available
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-preview-status-output
          path: output/preview.mp4
          if-no-files-found: ignore
