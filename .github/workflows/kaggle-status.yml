name: Check Kaggle preview status
on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    paths:
      - ".github/workflows/kaggle-status.yml"
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Kaggle CLI
        run: python -m pip install --upgrade kaggle six requests
      - name: Check GPU and CPU notebook statuses; download completed output
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          KAGGLE_USER=$(python - <<'PY'
          import os,requests
          r=requests.post("https://www.kaggle.com/api/v1/oauth2/introspect",data={"token":os.environ["KAGGLE_API_TOKEN"]},timeout=30)
          r.raise_for_status(); d=r.json()
          if not d.get("active"): raise SystemExit("Kaggle token inactive")
          print(d["username"])
          PY
          )
          kaggle kernels status "$KAGGLE_USER/straw-refraction-preview"
          kaggle kernels output "$KAGGLE_USER/straw-refraction-preview" -p output_gpu || true
          kaggle kernels status "$KAGGLE_USER/straw-refraction-cpu-preview"
          kaggle kernels output "$KAGGLE_USER/straw-refraction-cpu-preview" -p output_cpu || true
          kaggle kernels status "$KAGGLE_USER/straw-refraction-fast-preview"
          kaggle kernels output "$KAGGLE_USER/straw-refraction-fast-preview" -p output_fast || true
      - name: Upload GPU preview if available
        uses: actions/upload-artifact@v4
        with:
          name: straw-refraction-gpu-preview
          path: output_gpu/preview.mp4
          if-no-files-found: ignore
      - name: Upload Kaggle kernel logs for debugging
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-preview-debug-logs
          path: |
            output_gpu/*.log
            output_cpu/*.log
          if-no-files-found: ignore
      - name: Upload fast preview if available
        uses: actions/upload-artifact@v4
        with:
          name: straw-refraction-fast-preview
          path: output_fast/preview.mp4
          if-no-files-found: ignore
      - name: Upload CPU preview if available
        uses: actions/upload-artifact@v4
        with:
          name: straw-refraction-cpu-preview
          path: output_cpu/preview.mp4
          if-no-files-found: ignore

