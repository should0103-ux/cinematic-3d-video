name: Cinematic 3D production pipeline
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  actions: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Blender and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y blender ffmpeg
          blender --background --python scripts/blender_environment_check.py
      - name: Install project dependencies
        run: npm install
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Run existing pipeline smoke test (not final video)
        run: npm run render
      - name: Upload pipeline smoke test
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-smoke-test
          path: output/cinematic-video.mp4
          retention-days: 3
