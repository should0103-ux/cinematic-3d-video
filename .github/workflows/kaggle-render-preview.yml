name: Kaggle render 30s preview
on:
  workflow_dispatch:
  push:
    paths:
      - "kaggle_preview/**"
      - ".github/workflows/kaggle-render-preview.yml"
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Kaggle CLI
        run: python -m pip install --upgrade kaggle six
      - name: Configure Kaggle token
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          mkdir -p ~/.kaggle
          printf '{"username":"%s","key":"%s"}' "$KAGGLE_USERNAME" "$KAGGLE_API_TOKEN" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json
      - name: Push notebook to Kaggle and start execution
        run: kaggle kernels push -p kaggle_preview
      - name: Wait for Kaggle notebook completion
        env:
          SLUG: ${{ secrets.KAGGLE_USERNAME }}/straw-refraction-preview
        run: |
          for i in $(seq 1 180); do
            STATUS=$(kaggle kernels status "$SLUG" 2>&1 || true)
            echo "$STATUS"
            echo "$STATUS" | grep -Eiq "complete|finished" && break
            echo "$STATUS" | grep -Eiq "error|failed" && exit 1
            sleep 120
          done
          kaggle kernels output "$SLUG" -p output
      - name: Upload MP4 preview
        uses: actions/upload-artifact@v4
        with:
          name: straw-refraction-preview
          path: output/preview.mp4
          if-no-files-found: error
