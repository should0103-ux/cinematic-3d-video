name: Kaggle render 30s preview
on:
  workflow_dispatch:
  push:
    paths:
      - "kaggle_preview/**"
      - ".github/workflows/kaggle-render-preview.yml"
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Kaggle CLI
        run: python -m pip install --upgrade kaggle six requests
      - name: Resolve Kaggle username from token securely
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          python - <<'PY'
          import os, requests, json
          token=os.environ["KAGGLE_API_TOKEN"]
          r=requests.post("https://www.kaggle.com/api/v1/oauth2/introspect", data={"token":token}, timeout=30)
          r.raise_for_status()
          info=r.json()
          if not info.get("active") or not info.get("username"):
              raise SystemExit("Kaggle token introspection did not return an active username.")
          user=info["username"]
          print("Authenticated Kaggle user:", user)
          with open(os.environ["GITHUB_ENV"],"a") as f: f.write("KAGGLE_USERNAME="+user+"\\n")
          p="kaggle_preview/kernel-metadata.json"
          meta=json.load(open(p))
          meta["id"]=user+"/straw-refraction-preview"
          json.dump(meta,open(p,"w"),indent=2)
          PY
      - name: Push notebook to Kaggle and start execution
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: kaggle kernels push -p kaggle_preview
      - name: Wait for Kaggle notebook completion
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          SLUG: ${{ env.KAGGLE_USERNAME }}/straw-refraction-preview
        run: |
          for i in $(seq 1 180); do
            STATUS=$(kaggle kernels status "$SLUG" 2>&1 || true)
            echo "$STATUS"
            echo "$STATUS" | grep -Eiq "complete|finished" && break
            echo "$STATUS" | grep -Eiq "error|failed" && exit 1
            sleep 120
          done
          kaggle kernels output "$SLUG" -p output
      - name: Upload MP4 preview
        uses: actions/upload-artifact@v4
        with:
          name: straw-refraction-preview
          path: output/preview.mp4
          if-no-files-found: error
