name: Godot animated GLB render test

on:
  push:
    branches: [main]
    paths:
      - "godot_project/**"
      - ".github/workflows/godot-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot-render-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install video and virtual display tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg unzip

      - name: Install pinned Godot engine
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-all-errors --retry-delay 2 \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" \
            -o /tmp/godot.zip
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          GODOT_BIN="$(find /tmp/godot -type f -name 'Godot_v4.7.2-stable_linux.x86_64' -print -quit)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          "$GODOT_BIN" --version

      - name: Download CC0 humanoid animation pack
        run: |
          set -euo pipefail
          mkdir -p godot_project/assets
          curl -fL --retry 4 --retry-all-errors --retry-delay 2 \
            "https://github.com/Kinemiq/free-game-animations/releases/download/v1.0/KinemIQ_Free_Animations_CC0_GLB.zip" \
            -o /tmp/cc0-animations.zip
          unzip -q /tmp/cc0-animations.zip -d godot_project/assets
          find godot_project/assets -type f -iname '*.glb' -print
          GLB_COUNT="$(find godot_project/assets -type f -iname '*.glb' | wc -l)"
          test "$GLB_COUNT" -gt 0
          echo "Imported $GLB_COUNT GLB files"
          curl -fL --retry 4 --retry-all-errors --retry-delay 2 \
            "https://files.innerscene.com/library/laboratory-researcher-3d-person-healthcare-7a3ceb81/91ad770e07d2be3604e3/professional-lab-researcher.glb" \
            -o godot_project/assets/researcher.glb
          test -s godot_project/assets/researcher.glb
          curl -fL --retry 4 --retry-all-errors --retry-delay 2 \
            "https://files.innerscene.com/library/ant-5407c615/ab00cc85c25944f9f39c/ant.glb" \
            -o godot_project/assets/ant.glb
          test -s godot_project/assets/ant.glb

      - name: Import GLB assets and validate project
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --editor --path godot_project --quit

      - name: Render 33-second cinematic video
        run: |
          set -euo pipefail
          mkdir -p godot_project/output
          xvfb-run -a "$GODOT_BIN" \
            --path godot_project \
            --rendering-method gl_compatibility \
            --audio-driver Dummy \
            --fixed-fps 30 \
            --write-movie output/godot-final.avi \
            --quit-after 990
          test -s godot_project/output/godot-final.avi
          ffmpeg -hide_banner -y -i godot_project/output/godot-test.avi \
            -an -c:v libx264 -preset medium -crf 20 \
            -pix_fmt yuv420p -movflags +faststart \
            godot_project/output/godot-final.mp4
          test -s godot_project/output/godot-final.mp4
          ffprobe -v error -show_entries format=duration,size \
            -of default=noprint_wrappers=1 godot_project/output/godot-test.mp4

      - name: Upload Godot test video
        uses: actions/upload-artifact@v4
        with:
          name: godot-33-second-cinematic-video
          path: |
            godot_project/output/godot-test.mp4
            godot_project/output/godot-test.avi
          if-no-files-found: error
          retention-days: 7
